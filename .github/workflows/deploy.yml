name: Deploy

on:
  push:
    branches: [ main ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  SERVER_IP: 185.56.162.117

jobs:
  build-and-deploy: # Объединили в одну задачу для простоты
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- ЭТАП 1: СБОРКА ОБРАЗА (Тут работает твой Dockerfile) ---
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          # Собираем образ из Dockerfile в корне
          docker build -t ${{ secrets.DOCKER_USERNAME }}/deputy-pwa:latest .
          # Отправляем его в облако, чтобы сервер мог его скачать
          docker push ${{ secrets.DOCKER_USERNAME }}/deputy-pwa:latest

      # --- ЭТАП 2: КОПИРОВАНИЕ НАСТРОЕК ---
      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Если файл в корне, strip_components должен быть 0
          source: "docker-compose.frontend-pwa.yml"
          target: "/home/DeputyApp"
          strip_components: 0

      # --- ЭТАП 3: ЗАПУСК НА СЕРВЕРЕ ---
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/DeputyApp
            
            # Логинимся на сервере, чтобы была возможность скачать приватный образ
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Обновляем образ
            docker compose -f docker-compose.frontend-pwa.yml pull
            
            # Перезапускаем контейнер
            docker compose -f docker-compose.frontend-pwa.yml up -d
            
            # Очистка места
            docker image prune -f
            
            # Перезагружаем прокси
            docker exec nginx-proxy nginx -s reload
